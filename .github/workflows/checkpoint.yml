# Generated by Checkpoint. You own this file: edit it as you need.
# Each job saves its results. The Report job turns them into one PR comment and one check per family.
# Thresholds and modes are in checkpoint.yml.
name: Checkpoint
on:
  pull_request:
  push:
    branches:
      - main
permissions: {}
concurrency:
  group: checkpoint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  quality-swift:
    name: Quality (swift)
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Checkpoint
        run: |-
          echo "CHECKPOINT_OUT=$RUNNER_TEMP/checkpoint" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/checkpoint/tools"
          if [ ! -f "$GITHUB_WORKSPACE/.checkpoint/checkpoint.mjs.gz" ]; then echo "::error::.checkpoint/checkpoint.mjs.gz is missing. Scan the repository in Checkpoint again to add it."; exit 1; fi
          mkdir -p "$RUNNER_TEMP/checkpoint-cli"
          gunzip -c "$GITHUB_WORKSPACE/.checkpoint/checkpoint.mjs.gz" > "$RUNNER_TEMP/checkpoint-cli/checkpoint.mjs"
          printf '#!/bin/sh\nexec node "%s/checkpoint-cli/checkpoint.mjs" "$@"\n' "$RUNNER_TEMP" > "$RUNNER_TEMP/checkpoint-cli/checkpoint"
          chmod +x "$RUNNER_TEMP/checkpoint-cli/checkpoint"
          echo "$RUNNER_TEMP/checkpoint-cli" >> "$GITHUB_PATH"
      - name: Build
        run: checkpoint exec --check build --project . --parse generic -- swift build
      - name: Save results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checkpoint-swift
          path: ${{ runner.temp }}/checkpoint
          retention-days: 7
          if-no-files-found: ignore
  quality-legacy:
    name: Quality (legacy)
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync --locked --all-extras --all-groups
        working-directory: legacy
        continue-on-error: true
      - name: Set up Checkpoint
        run: |-
          echo "CHECKPOINT_OUT=$RUNNER_TEMP/checkpoint" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/checkpoint/tools"
          if [ ! -f "$GITHUB_WORKSPACE/.checkpoint/checkpoint.mjs.gz" ]; then echo "::error::.checkpoint/checkpoint.mjs.gz is missing. Scan the repository in Checkpoint again to add it."; exit 1; fi
          mkdir -p "$RUNNER_TEMP/checkpoint-cli"
          gunzip -c "$GITHUB_WORKSPACE/.checkpoint/checkpoint.mjs.gz" > "$RUNNER_TEMP/checkpoint-cli/checkpoint.mjs"
          printf '#!/bin/sh\nexec node "%s/checkpoint-cli/checkpoint.mjs" "$@"\n' "$RUNNER_TEMP" > "$RUNNER_TEMP/checkpoint-cli/checkpoint"
          chmod +x "$RUNNER_TEMP/checkpoint-cli/checkpoint"
          echo "$RUNNER_TEMP/checkpoint-cli" >> "$GITHUB_PATH"
      - name: Install check tools
        run: uv pip install ruff==0.16.10
        working-directory: legacy
        continue-on-error: true
      - name: Lint
        run: checkpoint exec --check lint --project legacy --parse generic -- uv run --no-sync ruff check --output-format concise .
        working-directory: legacy
      - name: Save results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checkpoint-legacy
          path: ${{ runner.temp }}/checkpoint
          retention-days: 7
          if-no-files-found: ignore
  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Checkpoint
        run: |-
          echo "CHECKPOINT_OUT=$RUNNER_TEMP/checkpoint" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/checkpoint/tools"
          if [ ! -f "$GITHUB_WORKSPACE/.checkpoint/checkpoint.mjs.gz" ]; then echo "::error::.checkpoint/checkpoint.mjs.gz is missing. Scan the repository in Checkpoint again to add it."; exit 1; fi
          mkdir -p "$RUNNER_TEMP/checkpoint-cli"
          gunzip -c "$GITHUB_WORKSPACE/.checkpoint/checkpoint.mjs.gz" > "$RUNNER_TEMP/checkpoint-cli/checkpoint.mjs"
          printf '#!/bin/sh\nexec node "%s/checkpoint-cli/checkpoint.mjs" "$@"\n' "$RUNNER_TEMP" > "$RUNNER_TEMP/checkpoint-cli/checkpoint"
          chmod +x "$RUNNER_TEMP/checkpoint-cli/checkpoint"
          echo "$RUNNER_TEMP/checkpoint-cli" >> "$GITHUB_PATH"
      - name: Secrets (Gitleaks)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |-
          if [ -n "$BASE_SHA" ]; then target=(git /src "--log-opts=$BASE_SHA..$HEAD_SHA"); else target=(dir /src); fi
          checkpoint exec --check secrets -- docker run --rm -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/src -v "$GITHUB_WORKSPACE:/src" -v "$CHECKPOINT_OUT:/out" ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f "${target[@]}" --report-format sarif --report-path /out/tools/gitleaks.sarif --exit-code 0 --no-banner
      - name: Dependencies (OSV-Scanner)
        run: checkpoint exec --check dependencies --ok-codes 0,1,128 -- docker run --rm -v "$GITHUB_WORKSPACE:/src" -v "$CHECKPOINT_OUT:/out" ghcr.io/google/osv-scanner@sha256:afd838850ac1a0fcc15ff4a041dc9ba11123c3f0d2666217a5f0fcf9222b55fa scan source --recursive --licenses=0BSD,Apache-2.0,BlueOak-1.0.0,BSD-2-Clause,BSD-3-Clause,CC0-1.0,CC-BY-4.0,ISC,MIT,MPL-2.0,PSF-2.0,Python-2.0,Unlicense,Zlib --format json --output-file /out/tools/osv.json /src
      - name: Bugs and code vulnerabilities (Semgrep)
        run: checkpoint exec --check sast --ok-codes 0,1 -- docker run --rm -v "$GITHUB_WORKSPACE:/src" -v "$CHECKPOINT_OUT:/out" -w /src semgrep/semgrep@sha256:32e459968daabe7ab86968184a29109b9564aa00392401156f9788452b42786b semgrep scan --config p/default --config .checkpoint/semgrep.yml --sarif --output /out/tools/semgrep.sarif --metrics off --quiet --exclude .checkpoint
      - name: Install zizmor
        continue-on-error: true
        run: python3 -m venv "$RUNNER_TEMP/tools" && "$RUNNER_TEMP/tools/bin/pip" install --quiet zizmor==1.30.1
      - name: Workflow hardening (zizmor)
        run: checkpoint exec --check workflows --ok-codes 0,10,11,12,13,14 --stdout-file "$CHECKPOINT_OUT/tools/zizmor.sarif" -- "$RUNNER_TEMP/tools/bin/zizmor" --offline --format sarif .github/workflows
      - name: Workflow syntax (actionlint)
        run: checkpoint exec --check workflows --ok-codes 0,1 --stdout-file "$CHECKPOINT_OUT/tools/actionlint.json" -- docker run --rm -v "$GITHUB_WORKSPACE:/repo" -w /repo rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -format '{{json .}}'
      - name: Save results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checkpoint-security
          path: ${{ runner.temp }}/checkpoint
          retention-days: 7
          if-no-files-found: ignore
  maintainability:
    name: Maintainability
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Checkpoint
        run: |-
          echo "CHECKPOINT_OUT=$RUNNER_TEMP/checkpoint" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/checkpoint/tools"
          if [ ! -f "$GITHUB_WORKSPACE/.checkpoint/checkpoint.mjs.gz" ]; then echo "::error::.checkpoint/checkpoint.mjs.gz is missing. Scan the repository in Checkpoint again to add it."; exit 1; fi
          mkdir -p "$RUNNER_TEMP/checkpoint-cli"
          gunzip -c "$GITHUB_WORKSPACE/.checkpoint/checkpoint.mjs.gz" > "$RUNNER_TEMP/checkpoint-cli/checkpoint.mjs"
          printf '#!/bin/sh\nexec node "%s/checkpoint-cli/checkpoint.mjs" "$@"\n' "$RUNNER_TEMP" > "$RUNNER_TEMP/checkpoint-cli/checkpoint"
          chmod +x "$RUNNER_TEMP/checkpoint-cli/checkpoint"
          echo "$RUNNER_TEMP/checkpoint-cli" >> "$GITHUB_PATH"
      - name: Install lizard
        continue-on-error: true
        run: python3 -m venv "$RUNNER_TEMP/tools" && "$RUNNER_TEMP/tools/bin/pip" install --quiet lizard==1.24.0
      - name: Complexity (Lizard)
        run: checkpoint exec --check complexity --stdout-file "$CHECKPOINT_OUT/tools/lizard.csv" -- "$RUNNER_TEMP/tools/bin/lizard" --csv -x "*/node_modules/*" -x "*/dist/*" -x "*/build/*" -x "*/.venv/*" -x "*/venv/*" -x "*/.dart_tool/*" -x "*/coverage/*" -x "*/.next/*" -x "*/vendor/*" -x "*/target/*" -x "*/obj/*" -x "*/.gradle/*" -x "*/.build/*" -x "./.checkpoint/*" .
      - name: Duplication (jscpd)
        run: checkpoint exec --check duplication -- npx --yes jscpd@5.4.0 --min-tokens 70 --reporters json --output "$CHECKPOINT_OUT/tools/jscpd" --silent --ignore "**/.git/**,**/.checkpoint/**,**/node_modules/**,**/dist/**,**/build/**,**/.venv/**,**/venv/**,**/.dart_tool/**,**/coverage/**,**/.next/**,**/vendor/**,**/target/**,**/obj/**,**/.gradle/**,**/.build/**,**/*.min.js,**/*.lock,**/*-lock.*,**/*.snap,.github/workflows/checkpoint.yml,checkpoint.yml" .
      - name: Save results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checkpoint-maintainability
          path: ${{ runner.temp }}/checkpoint
          retention-days: 7
          if-no-files-found: ignore
  report:
    name: Report
    runs-on: ubuntu-latest
    needs:
      - quality-swift
      - quality-legacy
      - security
      - maintainability
    if: always()
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: write
      checks: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Checkpoint
        run: |-
          echo "CHECKPOINT_OUT=$RUNNER_TEMP/checkpoint" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/checkpoint/tools"
          if [ ! -f "$GITHUB_WORKSPACE/.checkpoint/checkpoint.mjs.gz" ]; then echo "::error::.checkpoint/checkpoint.mjs.gz is missing. Scan the repository in Checkpoint again to add it."; exit 1; fi
          mkdir -p "$RUNNER_TEMP/checkpoint-cli"
          gunzip -c "$GITHUB_WORKSPACE/.checkpoint/checkpoint.mjs.gz" > "$RUNNER_TEMP/checkpoint-cli/checkpoint.mjs"
          printf '#!/bin/sh\nexec node "%s/checkpoint-cli/checkpoint.mjs" "$@"\n' "$RUNNER_TEMP" > "$RUNNER_TEMP/checkpoint-cli/checkpoint"
          chmod +x "$RUNNER_TEMP/checkpoint-cli/checkpoint"
          echo "$RUNNER_TEMP/checkpoint-cli" >> "$GITHUB_PATH"
      - name: Download results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: checkpoint-*
          merge-multiple: true
          path: ${{ runner.temp }}/checkpoint
      - name: Download the base branch baseline
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |-
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow checkpoint.yml --branch "$BASE_REF" --event push --status completed --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$run_id" ]; then echo "No Checkpoint run on $BASE_REF yet."; exit 0; fi
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name checkpoint-baseline --dir "$CHECKPOINT_OUT/previous" || echo "Run $run_id has no baseline."
      - name: Check and report
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
        run: checkpoint report
      - name: Save baseline
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checkpoint-baseline
          path: ${{ runner.temp }}/checkpoint/baseline.json
          if-no-files-found: ignore
